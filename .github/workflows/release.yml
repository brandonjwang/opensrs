name: Release

# Cuts a GitHub Release with a downloadable APK whenever a v* tag is pushed.
# Builds are deliberate: nothing runs on ordinary pushes to main.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build + publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history, for commit-count versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # Decode the private release keystore from a CI secret. If the secret is
      # not set yet, this step is skipped and the build falls back to the
      # committed debug key (still produces a working, installable APK).
      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore

      - name: Build release APK
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Rename APK with version
        run: cp app/build/outputs/apk/release/app-release.apk "OpenSRS-${GITHUB_REF_NAME}.apk"

      # gh CLI instead of softprops/action-gh-release: idempotent when a
      # release/draft already exists for the tag (softprops aborts with
      # "tag_name already_exists" on its finalize call).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ARGS=(--title "Open SRS $TAG" --generate-notes)
          case "$TAG" in *alpha*|*beta*|*rc*) ARGS+=(--prerelease);; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "${ARGS[@]}"
          gh release upload "$TAG" "OpenSRS-${TAG}.apk" --clobber
