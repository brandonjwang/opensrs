name: Release

# Cuts a GitHub Release with a downloadable APK whenever a v* tag is pushed.
# Builds are deliberate: nothing runs on ordinary pushes to main.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build + publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history, for commit-count versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # Debug-signed on purpose: an unsigned release APK cannot be installed
      # for sideloading. Swap to assembleRelease + a signing config from
      # GitHub Secrets when this graduates past alpha / heads to Play.
      - name: Build APK
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk "OpenSRS-${GITHUB_REF_NAME}.apk"

      # gh CLI instead of softprops/action-gh-release: idempotent when a
      # release/draft already exists for the tag (softprops aborts with
      # "tag_name already_exists" on its finalize call).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ARGS=(--title "Open SRS $TAG" --generate-notes)
          case "$TAG" in *alpha*|*beta*|*rc*) ARGS+=(--prerelease);; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "${ARGS[@]}"
          gh release upload "$TAG" "OpenSRS-${TAG}.apk" --clobber
