name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test + assemble (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Caches ~/.gradle keyed on lockfiles; the runner's preinstalled
      # Android SDK satisfies compileSdk 35 (licenses pre-accepted).
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
